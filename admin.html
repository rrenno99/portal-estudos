<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Painel de Controle | Planejador Renno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <script src="js/mentor.js"></script>
  <style>
    .admin-page { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .admin-header h1 { font-size: 1.3rem; font-weight: 800; color: var(--secondary); }
    .admin-back { font-size: 0.85rem; color: var(--primary); font-weight: 600; }

    .admin-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .admin-card h2 { font-size: 1rem; font-weight: 700; color: var(--secondary); margin-bottom: 12px; }

    .dropzone {
      border: 2.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg);
    }
    .dropzone:hover { border-color: var(--primary); background: rgba(30,136,229,0.03); }
    .dropzone.dragging { border-color: var(--primary); background: rgba(30,136,229,0.06); }
    .dropzone.has-file { border-color: var(--success); background: rgba(56,161,105,0.04); }
    .dropzone-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .dropzone-text { font-size: 0.88rem; color: var(--text-light); }
    .dropzone-filename { font-size: 0.88rem; font-weight: 600; color: var(--success); margin-top: 8px; }

    .preview-box {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-top: 16px;
      font-size: 0.85rem;
      max-height: 400px;
      overflow-y: auto;
    }
    .preview-box table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .preview-box th { text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--border); color: var(--text-light); font-weight: 600; }
    .preview-box td { padding: 6px 8px; border-bottom: 1px solid var(--border); }

    .plan-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .plan-list-item:last-child { border-bottom: none; }
    .plan-list-name { font-weight: 600; color: var(--secondary); }
    .plan-list-meta { font-size: 0.75rem; color: var(--text-lighter); }

    .status-msg {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-top: 16px;
      display: none;
    }
    .status-msg.success { display: block; background: #F0FFF4; border: 1px solid #C6F6D5; color: #276749; }
    .status-msg.error { display: block; background: #FFF5F5; border: 1px solid #FED7D7; color: #C53030; }

    /* --- Admin Tabs --- */
    .admin-tabs { display: flex; gap: 0; margin-bottom: 32px; border-bottom: 2px solid var(--border); }
    .admin-tab {
      padding: 10px 20px; font-size: 0.88rem; font-weight: 600; color: var(--text-light);
      cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: all 0.2s; font-family: inherit;
    }
    .admin-tab:hover { color: var(--primary); }
    .admin-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .admin-section { display: none; }
    .admin-section.active { display: block; }

    /* --- Gestao de Alunos --- */
    .alunos-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .alunos-toolbar h2 { margin: 0; }
    .alunos-search {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.82rem; font-family: inherit; width: 220px; background: var(--bg);
    }
    .alunos-search:focus { outline: none; border-color: var(--primary); }

    .alunos-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .alunos-table th {
      text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border);
      color: var(--text-light); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .alunos-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .alunos-table tr:hover { background: rgba(30,136,229,0.02); }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 0.7rem; font-weight: 600;
    }
    .badge-active { background: #F0FFF4; color: #276749; }
    .badge-inactive { background: #FFF5F5; color: #C53030; }
    .badge-expired { background: #FFFAF0; color: #C05621; }

    .alunos-table .actions-cell { white-space: nowrap; }
    .alunos-table .actions-cell button {
      font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; cursor: pointer;
      font-family: inherit; border: 1px solid var(--border); background: var(--bg); margin-right: 4px;
    }
    .alunos-table .actions-cell button:hover { border-color: var(--primary); color: var(--primary); }
    .alunos-table .actions-cell .btn-danger { border-color: #FED7D7; background: #FFF5F5; color: #C53030; }
    .alunos-table .actions-cell .btn-danger:hover { background: #FED7D7; }

    .empty-state { text-align: center; padding: 32px; color: var(--text-lighter); font-size: 0.85rem; }

    /* --- Modal --- */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg-card); border-radius: var(--radius); padding: 28px;
      width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    .modal h3 { font-size: 1.05rem; font-weight: 700; color: var(--secondary); margin-bottom: 20px; }
    .modal label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-light); margin-bottom: 4px; }
    .modal input {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.85rem; font-family: inherit; margin-bottom: 14px; box-sizing: border-box;
    }
    .modal input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,136,229,0.1); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .modal .status-msg { margin-top: 12px; margin-bottom: 0; }

    .alunos-count { font-size: 0.75rem; color: var(--text-lighter); font-weight: 400; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="admin-page">
    <div class="admin-header">
      <h1>⚙️ Painel de Administrador</h1>
      <a href="dashboard.html" class="admin-back">← Voltar ao Dashboard</a>
    </div>

    <!-- Tabs -->
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab('planos')">Planos Mestres</button>
      <button class="admin-tab" onclick="switchTab('alunos')">Gestao de Alunos</button>
    </div>

    <!-- ==================== TAB: PLANOS MESTRES ==================== -->
    <div class="admin-section active" id="section-planos">

    <!-- Upload -->
    <div class="admin-card">
      <h2>Subir Plano (.md)</h2>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('mdFileInput').click()">
        <div class="dropzone-icon">📄</div>
        <div class="dropzone-text">Arraste o arquivo .md aqui ou clique para selecionar</div>
        <div class="dropzone-filename" id="dropzoneFilename" style="display:none"></div>
      </div>
      <input type="file" id="mdFileInput" accept=".md,.markdown,.txt" style="display:none" onchange="handleMdUpload(this)">

      <!-- Preview -->
      <div id="previewArea" style="display:none">
        <div class="preview-box">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <strong id="previewTitulo" style="font-size:0.95rem;color:var(--secondary)">—</strong>
            <span id="previewMeta" style="font-size:0.75rem;color:var(--text-lighter)"></span>
          </div>
          <table>
            <thead><tr><th>Materia</th><th>Questoes</th><th>Peso</th><th>Pontos</th><th>Topicos</th></tr></thead>
            <tbody id="previewTable"></tbody>
          </table>
        </div>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn btn-primary" onclick="salvarPlano()" id="btnSalvar">🚀 Publicar Plano para os Alunos</button>
          <button class="btn btn-ghost" onclick="limparUpload()">Cancelar</button>
        </div>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </div>

    <!-- Existing plans -->
    <div class="admin-card">
      <h2>Planos Publicados</h2>
      <div id="planosLista">
        <p style="color:var(--text-lighter);font-size:0.85rem;text-align:center;padding:16px">Carregando...</p>
      </div>
    </div>

    </div><!-- /section-planos -->

    <!-- ==================== TAB: GESTAO DE ALUNOS ==================== -->
    <div class="admin-section" id="section-alunos">

    <div class="admin-card">
      <div class="alunos-toolbar">
        <h2>Alunos Cadastrados <span class="alunos-count" id="alunosCount"></span></h2>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" class="alunos-search" id="alunosBusca" placeholder="Buscar por nome ou e-mail..." oninput="filtrarAlunos()">
          <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Cadastrar Aluno</button>
        </div>
      </div>

      <div id="alunosTabela">
        <p class="empty-state">Carregando...</p>
      </div>
    </div>

    </div><!-- /section-alunos -->

    <!-- Modal: Cadastrar Aluno -->
    <div class="modal-overlay" id="modalAluno">
      <div class="modal">
        <h3>Cadastrar Novo Aluno</h3>
        <label for="alunoNome">Nome</label>
        <input type="text" id="alunoNome" placeholder="Nome completo do aluno">

        <label for="alunoEmail">E-mail</label>
        <input type="email" id="alunoEmail" placeholder="aluno@email.com">

        <label for="alunoValidade">Data de Validade (expiracao do acesso)</label>
        <input type="date" id="alunoValidade">

        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
          <button class="btn btn-primary" id="btnSalvarAluno" onclick="salvarAluno()">Salvar Aluno</button>
        </div>
        <div class="status-msg" id="modalStatus"></div>
      </div>
    </div>

  </div><!-- /admin-page -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    var ADMIN_EMAILS = ['rodrigorenno99@gmail.com'];
    var _sb = null;
    var _userId = null;
    var _parsedPlan = null;

    // Init
    (async function() {
      _sb = window.supabase.createClient(
        'https://hcngacohwiwphcbroint.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbmdhY29od2l3cGhjYnJvaW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MDc1MjUsImV4cCI6MjA5MDQ4MzUyNX0.Rv9OlD7pltClHO2JyoEk5q7htUfUWc__StgxOQK4uaM',
        { auth: { persistSession: true, storageKey: 'studyplan-auth', autoRefreshToken: true, detectSessionInUrl: true } }
      );

      var { data: { session } } = await _sb.auth.getSession();
      if (!session) {
        // Try getUser as fallback
        var { data: { user } } = await _sb.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }
        _userId = user.id;
        var email = user.email;
      } else {
        _userId = session.user.id;
        var email = session.user.email;
      }

      console.log('[Admin] Email logado:', email);

      if (ADMIN_EMAILS.indexOf(email) === -1) {
        document.querySelector('.admin-page').innerHTML = '<div style="text-align:center;padding:60px"><h2 style="color:#E53E3E">Acesso Negado</h2><p style="margin-top:8px">Esta pagina e restrita ao administrador.</p><p style="font-size:0.78rem;color:var(--text-lighter);margin-top:4px">Email atual: ' + email + '</p><a href="dashboard.html" class="btn btn-primary" style="margin-top:16px">Voltar ao Dashboard</a></div>';
        return;
      }

      carregarPlanosExistentes();
    })();

    // Drag and drop
    var dz = document.getElementById('dropzone');
    dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('dragging'); });
    dz.addEventListener('dragleave', function() { dz.classList.remove('dragging'); });
    dz.addEventListener('drop', function(e) {
      e.preventDefault();
      dz.classList.remove('dragging');
      if (e.dataTransfer.files.length > 0) {
        document.getElementById('mdFileInput').files = e.dataTransfer.files;
        handleMdUpload(document.getElementById('mdFileInput'));
      }
    });

    async function handleMdUpload(input) {
      if (!input.files || !input.files[0]) return;
      var file = input.files[0];

      dz.classList.add('has-file');
      document.getElementById('dropzoneFilename').textContent = '✓ ' + file.name;
      document.getElementById('dropzoneFilename').style.display = '';
      document.getElementById('statusMsg').className = 'status-msg';

      var text = await file.text();
      _parsedPlan = window.MentorIA.parsePlanoMarkdown(text);

      // STRICT CONTRACT: reject if no frontmatter or missing required fields
      if (!_parsedPlan.hasFrontmatter) {
        showStatus('Erro: Arquivo fora do Padrao Estruturado Renno.\n\nO arquivo DEVE comecar com:\n---\nCONCURSO: Nome do Concurso\nCARGO: Nome do Cargo\nDATA_PROVA: DD/MM/AAAA\nBANCA: Nome da Banca\nTRILHA: consistente\n---', 'error');
        _parsedPlan = null;
        limparUpload();
        return;
      }

      // Show validation errors (but allow preview if materias exist)
      if (_parsedPlan.erros && _parsedPlan.erros.length > 0) {
        showStatus(_parsedPlan.erros.join('\n'), 'error');
        if (!_parsedPlan.concurso || !_parsedPlan.dataProva) {
          // Missing required → block
          _parsedPlan = null;
          return;
        }
      }

      if (!_parsedPlan.materias || _parsedPlan.materias.length === 0) {
        showStatus('Erro: Nenhuma materia encontrada.\n\nAdicione a secao:\n## Estrutura das Provas\n| Materia | Questoes | Peso | Pontos |\n|---------|----------|------|--------|\n| Nome | 10 | 1 | 10 |', 'error');
        return;
      }

      // Build preview header
      var titulo = _parsedPlan.concurso || 'Sem nome';
      if (_parsedPlan.cargo) titulo += ' — ' + _parsedPlan.cargo;
      document.getElementById('previewTitulo').textContent = titulo;

      var metaParts = [_parsedPlan.materias.length + ' materias'];
      if (_parsedPlan.banca) metaParts.push('Banca: ' + _parsedPlan.banca);

      // Data da prova with countdown
      if (_parsedPlan.dataProva) {
        var dataObj = new Date(_parsedPlan.dataProva + 'T00:00:00');
        var hoje = new Date(); hoje.setHours(0,0,0,0);
        var diasRestantes = Math.ceil((dataObj - hoje) / (1000*60*60*24));
        var dataFormatada = dataObj.toLocaleDateString('pt-BR');
        metaParts.push('Prova: ' + dataFormatada + ' (' + diasRestantes + ' dias)');
      } else {
        metaParts.push('⚠ SEM DATA DA PROVA');
      }

      if (_parsedPlan.trilha) metaParts.push('Trilha: ' + _parsedPlan.trilha);
      document.getElementById('previewMeta').innerHTML = metaParts.join(' · ');

      // Build table
      var tbody = document.getElementById('previewTable');
      tbody.innerHTML = _parsedPlan.materias.map(function(m) {
        var topicsShort = Array.isArray(m.topicos) ? m.topicos.slice(0, 3).join(', ') : (m.topicos || '—');
        if (topicsShort.length > 60) topicsShort = topicsShort.substring(0, 57) + '...';
        var pctLabel = m.relevancia ? ' (' + m.relevancia + '%)' : '';
        return '<tr>'
          + '<td style="font-weight:600;color:var(--secondary)">' + m.nome + '</td>'
          + '<td>' + (m.questoes || '—') + '</td>'
          + '<td>' + (m.peso || '—') + '</td>'
          + '<td style="font-weight:700;color:var(--primary)">' + (m.pontos || '—') + pctLabel + '</td>'
          + '<td style="font-size:0.75rem;color:var(--text-light)">' + topicsShort + '</td>'
          + '</tr>';
      }).join('');

      document.getElementById('previewArea').style.display = '';
    }

    async function salvarPlano() {
      if (!_parsedPlan || !_sb) return;
      var btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.textContent = '⏳ Salvando...';

      try {
        var materiasJson = _parsedPlan.materias.map(function(m) {
          return {
            nome: m.nome,
            questoes: m.questoes || 0,
            peso: m.peso || 1,
            pontos: m.pontos || 0,
            relevancia: m.relevancia || 0,
            topicos: Array.isArray(m.topicos) ? m.topicos : (m.topicos ? m.topicos.split(', ') : [])
          };
        });

        var { error } = await _sb.from('planos_mestres').upsert({
          concurso_nome: _parsedPlan.concurso || 'Sem nome',
          cargo: _parsedPlan.cargo || null,
          banca: _parsedPlan.banca || null,
          data_prova: _parsedPlan.dataProva || null,
          materias: materiasJson,
          trilha_sugerida: _parsedPlan.trilha || 'consistente',
          ativo: true,
          criado_por: _userId
        }, { onConflict: 'concurso_nome' });

        if (error) throw error;

        var successMsg = '✅ Plano "' + _parsedPlan.concurso + '" processado e disponivel para os alunos!';
        if (_parsedPlan.dataProva) {
          var dataObj = new Date(_parsedPlan.dataProva + 'T00:00:00');
          var dias = Math.ceil((dataObj - new Date().setHours(0,0,0,0)) / 86400000);
          successMsg += '\n📅 Data da prova: ' + dataObj.toLocaleDateString('pt-BR') + ' (' + dias + ' dias)';
        }
        successMsg += '\n📚 ' + materiasJson.length + ' materias | ' + _parsedPlan.totalPontos + ' pontos totais';
        showStatus(successMsg, 'success');
        limparUpload();
        carregarPlanosExistentes();

      } catch (e) {
        showStatus('Erro ao salvar: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = '🚀 Publicar Plano para os Alunos';
      }
    }

    function limparUpload() {
      _parsedPlan = null;
      document.getElementById('previewArea').style.display = 'none';
      document.getElementById('dropzone').classList.remove('has-file');
      document.getElementById('dropzoneFilename').style.display = 'none';
      document.getElementById('mdFileInput').value = '';
      document.getElementById('btnSalvar').disabled = false;
      document.getElementById('btnSalvar').textContent = '🚀 Publicar Plano para os Alunos';
    }

    async function carregarPlanosExistentes() {
      var lista = document.getElementById('planosLista');
      try {
        var { data, error } = await _sb.from('planos_mestres').select('*').order('created_at', { ascending: false });
        if (error) throw error;

        if (!data || data.length === 0) {
          lista.innerHTML = '<p style="color:var(--text-lighter);font-size:0.85rem;text-align:center;padding:16px">Nenhum plano publicado ainda.</p>';
          return;
        }

        lista.innerHTML = data.map(function(p) {
          var nMat = p.materias ? p.materias.length : 0;
          var status = p.ativo ? '<span style="color:var(--success);font-weight:600">Ativo</span>' : '<span style="color:var(--text-lighter)">Inativo</span>';
          return '<div class="plan-list-item">'
            + '<div>'
            + '<div class="plan-list-name">' + p.concurso_nome + (p.cargo ? ' — ' + p.cargo : '') + '</div>'
            + '<div class="plan-list-meta">' + nMat + ' materias · ' + (p.banca || 'Sem banca') + ' · ' + (p.data_prova || 'Sem data') + '</div>'
            + '</div>'
            + '<div style="display:flex;align-items:center;gap:12px">'
            + status
            + '<button onclick="togglePlano(\'' + p.id + '\',' + !p.ativo + ')" style="font-size:0.75rem;padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg);cursor:pointer;font-family:inherit">' + (p.ativo ? 'Desativar' : 'Ativar') + '</button>'
            + '<button onclick="deletarPlano(\'' + p.id + '\')" style="font-size:0.75rem;padding:4px 10px;border:1px solid #FED7D7;border-radius:4px;background:#FFF5F5;color:#C53030;cursor:pointer;font-family:inherit">Excluir</button>'
            + '</div>'
            + '</div>';
        }).join('');
      } catch (e) {
        lista.innerHTML = '<p style="color:#C53030;font-size:0.85rem">Erro: ' + e.message + '</p>';
      }
    }

    async function togglePlano(id, ativo) {
      await _sb.from('planos_mestres').update({ ativo: ativo }).eq('id', id);
      carregarPlanosExistentes();
    }

    async function deletarPlano(id) {
      if (!confirm('Tem certeza que deseja excluir este plano?')) return;
      await _sb.from('planos_mestres').delete().eq('id', id);
      carregarPlanosExistentes();
    }

    function showStatus(msg, type) {
      var el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.className = 'status-msg ' + type;
    }

    // =============================================
    //  TABS
    // =============================================
    function switchTab(tab) {
      document.querySelectorAll('.admin-tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.admin-section').forEach(function(s) { s.classList.remove('active'); });

      if (tab === 'alunos') {
        document.querySelectorAll('.admin-tab')[1].classList.add('active');
        document.getElementById('section-alunos').classList.add('active');
        carregarAlunos();
      } else {
        document.querySelectorAll('.admin-tab')[0].classList.add('active');
        document.getElementById('section-planos').classList.add('active');
      }
    }

    // =============================================
    //  GESTAO DE ALUNOS
    // =============================================
    var _alunosCache = [];

    async function carregarAlunos() {
      var container = document.getElementById('alunosTabela');
      try {
        var { data, error } = await _sb.from('usuarios_autorizados')
          .select('*')
          .order('activated_at', { ascending: false });

        if (error) throw error;
        _alunosCache = data || [];
        renderizarAlunos(_alunosCache);
      } catch (e) {
        container.innerHTML = '<p style="color:#C53030;font-size:0.85rem;text-align:center">Erro ao carregar: ' + e.message + '</p>';
      }
    }

    function renderizarAlunos(alunos) {
      var container = document.getElementById('alunosTabela');
      document.getElementById('alunosCount').textContent = '(' + alunos.length + ')';

      if (!alunos || alunos.length === 0) {
        container.innerHTML = '<p class="empty-state">Nenhum aluno cadastrado ainda.</p>';
        return;
      }

      var hoje = new Date();
      hoje.setHours(0,0,0,0);

      var html = '<table class="alunos-table"><thead><tr>'
        + '<th>Nome</th><th>E-mail</th><th>Status</th><th>Validade</th><th>Cadastro</th><th>Acoes</th>'
        + '</tr></thead><tbody>';

      alunos.forEach(function(a) {
        var status = a.subscription_status || 'active';
        var expirado = false;

        if (a.expires_at) {
          var expDate = new Date(a.expires_at);
          if (expDate < hoje) {
            expirado = true;
            status = 'expired';
          }
        }

        var badgeClass = status === 'active' ? 'badge-active' : (status === 'expired' ? 'badge-expired' : 'badge-inactive');
        var badgeText = status === 'active' ? 'Ativo' : (status === 'expired' ? 'Expirado' : 'Inativo');

        var validadeStr = a.expires_at ? new Date(a.expires_at).toLocaleDateString('pt-BR') : '—';
        var cadastroStr = a.activated_at ? new Date(a.activated_at).toLocaleDateString('pt-BR') : '—';
        var nomeDisplay = a.nome || '<span style="color:var(--text-lighter)">—</span>';

        var isActive = (status === 'active');
        var toggleLabel = isActive ? 'Desativar' : 'Ativar';
        var toggleStatus = isActive ? 'inactive' : 'active';

        html += '<tr>'
          + '<td style="font-weight:600;color:var(--secondary)">' + nomeDisplay + '</td>'
          + '<td>' + a.email + '</td>'
          + '<td><span class="badge ' + badgeClass + '">' + badgeText + '</span></td>'
          + '<td>' + validadeStr + '</td>'
          + '<td>' + cadastroStr + '</td>'
          + '<td class="actions-cell">'
          + '<button onclick="toggleAluno(\'' + a.email + '\',\'' + toggleStatus + '\')">' + toggleLabel + '</button>'
          + '<button class="btn-danger" onclick="excluirAluno(\'' + a.email + '\')">Excluir</button>'
          + '</td></tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function filtrarAlunos() {
      var termo = document.getElementById('alunosBusca').value.toLowerCase().trim();
      if (!termo) { renderizarAlunos(_alunosCache); return; }
      var filtrados = _alunosCache.filter(function(a) {
        return a.email.toLowerCase().includes(termo) || (a.nome && a.nome.toLowerCase().includes(termo));
      });
      renderizarAlunos(filtrados);
    }

    // --- Modal ---
    function abrirModal() {
      document.getElementById('alunoNome').value = '';
      document.getElementById('alunoEmail').value = '';
      document.getElementById('alunoValidade').value = '';
      document.getElementById('modalStatus').className = 'status-msg';
      document.getElementById('btnSalvarAluno').disabled = false;
      document.getElementById('btnSalvarAluno').textContent = 'Salvar Aluno';
      document.getElementById('modalAluno').classList.add('open');
    }

    function fecharModal() {
      document.getElementById('modalAluno').classList.remove('open');
    }

    // Close modal on overlay click
    document.getElementById('modalAluno').addEventListener('click', function(e) {
      if (e.target === this) fecharModal();
    });

    var PROVISIONING_KEY = 'prv_R3nn0_2026_s3cr3t_k3y_x7m9p2';

    async function salvarAluno() {
      var nome = document.getElementById('alunoNome').value.trim();
      var email = document.getElementById('alunoEmail').value.trim().toLowerCase();
      var validade = document.getElementById('alunoValidade').value;
      var statusEl = document.getElementById('modalStatus');
      var btn = document.getElementById('btnSalvarAluno');

      // Validate
      if (!email) {
        statusEl.textContent = 'E-mail e obrigatorio.';
        statusEl.className = 'status-msg error';
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        statusEl.textContent = 'E-mail invalido.';
        statusEl.className = 'status-msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Cadastrando...';
      statusEl.className = 'status-msg';

      try {
        var body = { email: email, nome: nome || null };
        if (validade) {
          body.expires_at = new Date(validade + 'T23:59:59').toISOString();
        }

        var response = await fetch('/api/create-student', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': PROVISIONING_KEY
          },
          body: JSON.stringify(body)
        });

        var result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Erro ao cadastrar');
        }

        // Show success with password info
        var msg = 'Aluno cadastrado com sucesso!\nSenha provisoria: ' + result.senha;
        if (result.email_sent) {
          msg += '\n\nE-mail de boas-vindas enviado para ' + email;
        } else {
          msg += '\n\n⚠ E-mail nao enviado' + (result.email_error ? ': ' + result.email_error : '') + '\nAnote a senha e repasse manualmente.';
        }

        statusEl.textContent = msg;
        statusEl.className = 'status-msg success';
        statusEl.style.whiteSpace = 'pre-line';

        // Keep modal open longer so admin can see the password
        setTimeout(function() {
          fecharModal();
          statusEl.style.whiteSpace = '';
          carregarAlunos();
        }, 5000);

      } catch (e) {
        statusEl.textContent = 'Erro: ' + e.message;
        statusEl.className = 'status-msg error';
        btn.disabled = false;
        btn.textContent = 'Salvar Aluno';
      }
    }

    async function toggleAluno(email, novoStatus) {
      try {
        var updateData = { subscription_status: novoStatus };
        if (novoStatus === 'active') {
          updateData.activated_at = new Date().toISOString();
          updateData.deactivated_at = null;
        } else {
          updateData.deactivated_at = new Date().toISOString();
        }

        var { error } = await _sb.from('usuarios_autorizados')
          .update(updateData)
          .eq('email', email);

        if (error) throw error;
        carregarAlunos();
      } catch (e) {
        alert('Erro ao atualizar: ' + e.message);
      }
    }

    async function excluirAluno(email) {
      if (!confirm('Tem certeza que deseja excluir o aluno ' + email + '?\n\nEle perdera o acesso ao sistema.')) return;
      try {
        var { error } = await _sb.from('usuarios_autorizados').delete().eq('email', email);
        if (error) throw error;
        carregarAlunos();
      } catch (e) {
        alert('Erro ao excluir: ' + e.message);
      }
    }
  </script>
</body>
</html>
