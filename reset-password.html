<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha | Planejador Renno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1E88E5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planejador">
  <link rel="apple-touch-icon" href="/icon.svg">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #EBF5FF 0%, var(--bg) 50%, #F0F4FF 100%);
      padding: 24px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 440px;
      padding: 40px;
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .login-brand-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .login-brand span {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--secondary);
    }

    .login-card h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--secondary);
      text-align: center;
      margin-bottom: 6px;
    }

    .login-card .subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-light);
      margin-bottom: 28px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      line-height: 1.5;
    }

    .alert.error {
      background: #FFF5F5;
      border: 1px solid #FED7D7;
      color: #C53030;
    }

    .alert.success {
      background: #F0FFF4;
      border: 1px solid #C6F6D5;
      color: #276749;
    }

    .alert.show { display: block; }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-lighter);
      padding: 4px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 0.82rem;
      color: var(--text-light);
    }
    .back-link:hover { color: var(--primary); }

    .btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .loading-state {
      text-align: center;
      padding: 20px 0;
      color: var(--text-light);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brand-icon">📚</div>
        <span>Planejador Renno</span>
      </div>

      <h1>Redefinir senha</h1>
      <p class="subtitle">Digite sua nova senha abaixo</p>

      <!-- Alerts -->
      <div class="alert error" id="alertError"></div>
      <div class="alert success" id="alertSuccess"></div>

      <!-- Loading state while session is being recovered -->
      <div class="loading-state" id="loadingState">Verificando link...</div>

      <!-- RESET FORM -->
      <form id="formReset" onsubmit="handleReset(event)" style="display:none;">
        <div class="form-group">
          <label for="novaSenha">Nova senha</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="novaSenha" placeholder="Minimo 6 caracteres" required minlength="6">
            <button type="button" class="password-toggle" onclick="togglePassword('novaSenha', this)">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmarSenha">Confirmar nova senha</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="confirmarSenha" placeholder="Repita a senha" required minlength="6">
            <button type="button" class="password-toggle" onclick="togglePassword('confirmarSenha', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnSalvar">Salvar nova senha</button>
      </form>

      <a href="login.html" class="back-link">← Voltar para o login</a>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { atualizarSenha } from './js/auth.js';

    const loadingEl = document.getElementById('loadingState');
    const formEl = document.getElementById('formReset');
    let sessionReady = false;

    function showForm() {
      if (sessionReady) return;
      sessionReady = true;
      loadingEl.style.display = 'none';
      formEl.style.display = 'block';
    }

    function showExpired() {
      if (sessionReady) return;
      loadingEl.style.display = 'none';
      showAlert('error', 'Link expirado ou invalido. Solicite um novo link na pagina de login.');
    }

    // -----------------------------------------------
    // Listen for auth state changes
    // With implicit flow + detectSessionInUrl, Supabase
    // auto-parses the hash fragment and fires this event
    // -----------------------------------------------
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        showForm();
      }
    });

    // -----------------------------------------------
    // Fallback: also try PKCE code exchange if present
    // -----------------------------------------------
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
      supabase.auth.exchangeCodeForSession(code).then(({ error }) => {
        if (error) {
          showExpired();
        } else {
          showForm();
        }
      });
    }

    // -----------------------------------------------
    // Fallback: check existing session after timeout
    // -----------------------------------------------
    setTimeout(async () => {
      if (sessionReady) return;
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showForm();
      } else {
        showExpired();
      }
    }, 5000);

    // -----------------------------------------------
    // Handle form submit
    // -----------------------------------------------
    window.handleReset = async function(e) {
      e.preventDefault();
      hideAlerts();

      const nova = document.getElementById('novaSenha').value;
      const confirmar = document.getElementById('confirmarSenha').value;

      if (nova !== confirmar) {
        showAlert('error', 'As senhas nao coincidem.');
        return;
      }

      const btn = document.getElementById('btnSalvar');
      btn.classList.add('loading');
      btn.textContent = 'Salvando...';

      try {
        await atualizarSenha(nova);
        showAlert('success', 'Senha atualizada! Redirecionando para a Dashboard...');
        formEl.style.display = 'none';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 2000);
      } catch (err) {
        showAlert('error', 'Erro ao atualizar senha: ' + err.message);
        btn.classList.remove('loading');
        btn.textContent = 'Salvar nova senha';
      }
    };
  </script>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function showAlert(type, msg) {
      hideAlerts();
      const el = document.getElementById(type === 'error' ? 'alertError' : 'alertSuccess');
      el.textContent = msg;
      el.classList.add('show');
    }

    function hideAlerts() {
      document.getElementById('alertError').classList.remove('show');
      document.getElementById('alertSuccess').classList.remove('show');
    }
  </script>
</body>
</html>
