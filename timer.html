<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro — Planejador Rennó</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
  <style>
    :root {
      --primary: #42A5F5;
      --primary-dark: #1E88E5;
      --bg: #0F1923;
      --bg-card: #1A2634;
      --bg-elevated: #223344;
      --text: #E8EDF2;
      --text-light: #8899AA;
      --text-lighter: #556677;
      --border: #2A3A4A;
      --success: #4CAF50;
      --warning: #FF9800;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.2s ease;
      --ring-size: min(45vw, 45vh, 180px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Header - collapses when very small */
    .timer-header {
      padding: 10px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .timer-header h1 { font-size: 0.78rem; font-weight: 600; color: var(--text-light); }
    .timer-header .materia {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80vw;
    }

    /* Body - centers the ring, fills available space */
    .timer-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      min-height: 0;
    }

    /* Ring - scales with viewport */
    .timer-ring {
      width: var(--ring-size);
      height: var(--ring-size);
      position: relative;
      margin-bottom: clamp(8px, 2vh, 20px);
      flex-shrink: 0;
    }
    .timer-ring svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 4; }
    .ring-fill { fill: none; stroke: var(--primary); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    /* Timer display - scales with container */
    .timer-display {
      font-size: clamp(1.6rem, 8vw, 2.8rem);
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      line-height: 1;
    }
    .timer-status {
      font-size: clamp(0.65rem, 2vw, 0.82rem);
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .timer-status.running { color: var(--success); }
    .timer-status.paused  { color: var(--warning); }
    .timer-status.stopped { color: var(--text-lighter); }

    /* Controls */
    .timer-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: clamp(8px, 2vh, 12px) clamp(14px, 4vw, 22px);
      border-radius: var(--radius-sm);
      font-size: clamp(0.75rem, 2.5vw, 0.88rem);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .btn.start  { background: var(--success); color: white; }
    .btn.pause  { background: var(--warning); color: white; }
    .btn.finish { background: var(--primary); color: white; }
    .btn.cancel { background: var(--bg-elevated); color: var(--text-light); border: 1px solid var(--border); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Footer */
    .timer-footer {
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.65rem;
      color: var(--text-lighter);
      text-align: center;
      flex-shrink: 0;
    }

    /* Feedback view */
    .feedback {
      display: none;
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }
    .feedback.show { display: flex; flex-direction: column; }
    .feedback h4 {
      font-size: clamp(0.82rem, 2.5vw, 0.95rem);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      text-align: center;
      flex-shrink: 0;
    }
    .feedback-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: clamp(10px, 2vh, 14px) 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      margin-bottom: 8px;
      transition: var(--transition);
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: clamp(0.78rem, 2.5vw, 0.88rem);
      color: var(--text);
      flex-shrink: 0;
    }
    .feedback-option:hover { border-color: var(--primary); background: var(--bg-elevated); }
    .feedback-option:disabled { opacity: 0.5; pointer-events: none; }
    .fb-icon {
      width: clamp(28px, 8vw, 36px);
      height: clamp(28px, 8vw, 36px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      flex-shrink: 0;
    }
    .fb-icon.green  { background: rgba(76,175,80,0.15); }
    .fb-icon.orange { background: rgba(255,152,0,0.15); }
    .fb-icon.gray   { background: var(--bg-elevated); }
    .fb-text strong { display: block; font-size: clamp(0.75rem, 2.2vw, 0.85rem); color: var(--text); }
    .fb-text span   { font-size: clamp(0.65rem, 1.8vw, 0.75rem); color: var(--text-light); }

    /* Pomodoro flash */
    .pomodoro-flash { animation: pomFlash 0.5s ease 3; }
    @keyframes pomFlash {
      0%, 100% { background: var(--bg); }
      50% { background: rgba(66,165,245,0.08); }
    }

    /* Very small windows: hide non-essential elements */
    @media (max-height: 350px) {
      .timer-header { padding: 6px 12px; }
      .timer-header h1 { display: none; }
      .timer-footer { display: none; }
      .timer-body { padding: 8px 12px; }
    }

    @media (max-width: 280px) {
      .timer-header h1 { display: none; }
      .timer-footer { display: none; }
      .btn { padding: 8px 12px; font-size: 0.75rem; }
    }

    /* Ultra-compact: ring hidden, just show time + buttons */
    @media (max-height: 250px) {
      .timer-ring { display: none; }
      .timer-display {
        font-size: clamp(1.8rem, 12vw, 3rem);
        margin-bottom: 8px;
      }
      .timer-status { margin-bottom: 8px; }
      .timer-body {
        padding: 8px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="timer-header">
    <div>
      <h1>Cronometro de Estudo</h1>
      <div class="materia" id="timerMateria">—</div>
    </div>
  </div>

  <div class="timer-body" id="timerBodyView">
    <div class="timer-ring">
      <svg viewBox="0 0 180 180" preserveAspectRatio="xMidYMid meet">
        <circle class="ring-bg" cx="90" cy="90" r="80"></circle>
        <circle class="ring-fill" id="ringFill" cx="90" cy="90" r="80"
          stroke-dasharray="502.65" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div class="timer-status stopped" id="timerStatus">Pronto</div>
      </div>
    </div>
    <div class="timer-controls">
      <button class="btn start" id="btnStart" onclick="timerStart()">▶ Iniciar</button>
      <button class="btn pause" id="btnPause" onclick="timerPause()" style="display:none">⏸ Pausar</button>
      <button class="btn finish" id="btnFinish" onclick="timerFinish()" style="display:none">✓ Finalizar</button>
      <button class="btn cancel" id="btnCancel" onclick="timerCancel()">✕ Cancelar</button>
    </div>
  </div>

  <div class="feedback" id="feedbackView">
    <h4>Como foi o estudo? <span id="feedbackTime" style="font-weight:400;color:var(--text-light)"></span></h4>
    <button class="feedback-option" onclick="feedback('concluiu')">
      <div class="fb-icon green">✓</div>
      <div class="fb-text">
        <strong>Conclui a aula</strong>
        <span>Marca a aula como 100% concluida</span>
      </div>
    </button>
    <button class="feedback-option" onclick="feedback('estudando')">
      <div class="fb-icon orange">▶</div>
      <div class="fb-text">
        <strong>Ainda estou estudando</strong>
        <span>Mantem a aula em andamento (50%)</span>
      </div>
    </button>
    <button class="feedback-option" onclick="feedback('marcar')">
      <div class="fb-icon gray">⏱</div>
      <div class="fb-text">
        <strong>Apenas marque o tempo</strong>
        <span>Salva as horas sem alterar o progresso</span>
      </div>
    </button>
  </div>

  <div class="timer-footer">
    Pomodoro: alerta em 25min e 50min · Mantenha esta janela visivel
  </div>

  <script>
    // =============================================
    //  CONFIG from URL params
    // =============================================
    var params = new URLSearchParams(window.location.search);
    var materia = params.get('materia') || 'Estudo';
    document.getElementById('timerMateria').textContent = materia;
    document.title = 'Pronto — ' + materia;

    // =============================================
    //  BROADCAST CHANNEL (communicate with dashboard)
    // =============================================
    var channel = new BroadcastChannel('planejador-timer');

    // =============================================
    //  TIMER STATE (wall-clock-based, mobile-safe)
    //
    //  Elapsed (ms) = accumulated + (running ? Date.now() - startedAt : 0)
    //
    //  This is robust to setInterval throttling when the tab is
    //  backgrounded or the phone switches apps: the UI tick only
    //  reads the wall clock; it never increments a counter.
    //
    //  Persisted to localStorage so reloads / tab kills restore state.
    // =============================================
    var STORAGE_KEY = 'planejador_timer_state';
    var interval = null;
    var state = {
      materia: materia,
      startedAt: null,       // ms timestamp of the current run segment; null when paused
      accumulated: 0,        // ms of time already counted from previous run segments
      running: false,
      alerted25: false,
      alerted50: false,
      createdAt: Date.now()  // first time this session started (for startTime reporting)
    };
    var isSubmitting = false;
    var RING_R = 80;
    var RING_CIRC = 2 * Math.PI * RING_R;

    function currentElapsedMs() {
      var extra = state.running && state.startedAt ? (Date.now() - state.startedAt) : 0;
      return state.accumulated + extra;
    }

    function currentSeconds() {
      return Math.floor(currentElapsedMs() / 1000);
    }

    function formatTime(totalSecs) {
      var h = Math.floor(totalSecs / 3600);
      var m = Math.floor((totalSecs % 3600) / 60);
      var s = totalSecs % 60;
      return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }

    function formatShort(totalSecs) {
      var m = Math.floor(totalSecs / 60);
      var s = totalSecs % 60;
      return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }

    function updateRing(secs) {
      var progress = (secs % (25 * 60)) / (25 * 60);
      var offset = RING_CIRC * (1 - progress);
      document.getElementById('ringFill').style.strokeDashoffset = offset;
    }

    function playBeep() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.25, 0.5].forEach(function(delay) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = 880;
          osc.type = 'sine';
          gain.gain.value = 0.15;
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.15);
        });
      } catch (e) {}
    }

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function clearPersisted() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    }

    function restoreState() {
      var raw;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
      if (!raw) return false;
      try {
        var saved = JSON.parse(raw);
        // Only restore if it's the same materia — different materia means a fresh session
        if (!saved || saved.materia !== materia) return false;
        state = {
          materia: saved.materia,
          startedAt: saved.startedAt || null,
          accumulated: saved.accumulated || 0,
          running: !!saved.running,
          alerted25: !!saved.alerted25,
          alerted50: !!saved.alerted50,
          createdAt: saved.createdAt || Date.now()
        };
        return true;
      } catch (e) { return false; }
    }

    // =============================================
    //  RENDER (reads wall-clock state, never mutates time)
    // =============================================
    function render() {
      var secs = currentSeconds();
      document.getElementById('timerDisplay').textContent = formatTime(secs);
      updateRing(secs);

      if (state.running) {
        document.getElementById('timerStatus').textContent = 'Estudando...';
        document.getElementById('timerStatus').className = 'timer-status running';
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnPause').style.display = '';
        document.getElementById('btnFinish').style.display = '';
        document.title = '[' + formatShort(secs) + '] ' + materia + ' — Planejador Renno';
      } else if (secs > 0) {
        document.getElementById('timerStatus').textContent = 'Pausado';
        document.getElementById('timerStatus').className = 'timer-status paused';
        document.getElementById('btnPause').style.display = 'none';
        document.getElementById('btnStart').style.display = '';
        document.getElementById('btnStart').textContent = '▶ Retomar';
        document.getElementById('btnFinish').style.display = '';
        document.title = '[PAUSADO] ' + materia + ' — Planejador Renno';
      } else {
        document.getElementById('timerStatus').textContent = 'Pronto';
        document.getElementById('timerStatus').className = 'timer-status stopped';
        document.getElementById('btnStart').style.display = '';
        document.getElementById('btnStart').textContent = '▶ Iniciar';
        document.getElementById('btnPause').style.display = 'none';
        document.getElementById('btnFinish').style.display = 'none';
        document.title = 'Pronto — ' + materia;
      }

      // Pomodoro alerts — use >= so crossing the threshold while backgrounded still fires
      if (secs >= 25 * 60 && !state.alerted25) {
        state.alerted25 = true;
        persist();
        playBeep();
        document.body.classList.add('pomodoro-flash');
        setTimeout(function() { document.body.classList.remove('pomodoro-flash'); }, 2000);
      }
      if (secs >= 50 * 60 && !state.alerted50) {
        state.alerted50 = true;
        persist();
        playBeep();
        document.body.classList.add('pomodoro-flash');
        setTimeout(function() { document.body.classList.remove('pomodoro-flash'); }, 2000);
      }

      channel.postMessage({ type: 'tick', seconds: secs, materia: materia });
    }

    function startTicking() {
      clearInterval(interval);
      interval = setInterval(render, 1000);
    }

    function stopTicking() {
      clearInterval(interval);
      interval = null;
    }

    // =============================================
    //  TIMER CONTROLS
    // =============================================
    function timerStart() {
      if (state.running) return;
      state.startedAt = Date.now();
      state.running = true;
      if (!state.accumulated) state.createdAt = state.startedAt; // first start sets session origin
      persist();
      render();
      startTicking();
      channel.postMessage({ type: 'started', materia: materia });
    }

    function timerPause() {
      if (!state.running) return;
      // Freeze wall-clock delta into accumulated
      state.accumulated += Date.now() - state.startedAt;
      state.startedAt = null;
      state.running = false;
      persist();
      stopTicking();
      render();
      channel.postMessage({ type: 'paused', seconds: currentSeconds(), materia: materia });
    }

    function timerFinish() {
      // Freeze elapsed if still running
      if (state.running && state.startedAt) {
        state.accumulated += Date.now() - state.startedAt;
        state.startedAt = null;
        state.running = false;
      }
      stopTicking();

      var secs = currentSeconds();
      if (secs < 5) {
        channel.postMessage({ type: 'cancelled', materia: materia });
        clearPersisted();
        window.close();
        return;
      }

      persist();
      var mins = Math.floor(secs / 60);
      var rem = secs % 60;
      document.getElementById('feedbackTime').textContent = '(' + mins + 'min ' + rem + 's)';
      document.getElementById('timerBodyView').style.display = 'none';
      document.getElementById('feedbackView').classList.add('show');
      document.title = 'Finalizar — ' + materia;
    }

    function timerCancel() {
      stopTicking();
      state.running = false;
      clearPersisted();
      channel.postMessage({ type: 'cancelled', materia: materia });
      window.close();
    }

    // =============================================
    //  FEEDBACK
    // =============================================
    function feedback(tipo) {
      if (isSubmitting) return;
      isSubmitting = true;

      document.querySelectorAll('.feedback-option').forEach(function(btn) {
        btn.disabled = true;
      });

      var h4 = document.querySelector('#feedbackView h4');
      if (h4) h4.innerHTML = '⏳ Salvando sessao...';

      channel.postMessage({
        type: 'finished',
        materia: materia,
        seconds: currentSeconds(),
        startTime: state.createdAt ? new Date(state.createdAt).toISOString() : new Date().toISOString(),
        feedback: tipo
      });
    }

    channel.onmessage = function(e) {
      if (e.data.type === 'saved') {
        clearPersisted();
        document.title = 'Salvo! — ' + materia;
        setTimeout(function() { window.close(); }, 800);
      }
    };

    // =============================================
    //  VISIBILITY / FOCUS: resync display from wall clock
    //  Mobile browsers throttle setInterval in background.
    //  When the user returns, we recompute from Date.now() so the
    //  display jumps to the correct elapsed time.
    // =============================================
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        render();
        if (state.running) startTicking();
      }
    });
    window.addEventListener('focus', function() {
      render();
      if (state.running) startTicking();
    });

    // =============================================
    //  PREVENT ACCIDENTAL CLOSE
    // =============================================
    window.addEventListener('beforeunload', function(e) {
      var secs = currentSeconds();
      if (secs > 5 && !isSubmitting) {
        e.preventDefault();
        e.returnValue = 'Sua sessao ainda esta ativa. Deseja mesmo sair?';
        return e.returnValue;
      }
    });

    // =============================================
    //  BOOT: restore previous session if any
    // =============================================
    (function boot() {
      var restored = restoreState();
      render();
      if (state.running) startTicking();
      if (restored) {
        console.log('[Timer] Restored session:', currentSeconds(), 's');
      }
    })();
  </script>
</body>
</html>
