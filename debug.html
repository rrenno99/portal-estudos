<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug — Supabase</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #0f0; font-size: 14px; }
    .log { margin: 4px 0; padding: 4px 8px; }
    .error { color: #f44; }
    .warn { color: #fa0; }
    .ok { color: #0f0; }
    button { margin: 10px 4px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
    pre { white-space: pre-wrap; word-break: break-all; background: #222; padding: 10px; border-radius: 4px; margin: 8px 0; }
  </style>
</head>
<body>
  <h2>Diagnóstico Supabase</h2>
  <button onclick="runDiagnostic()">Executar Diagnóstico Completo</button>
  <button onclick="testInsertPerfil()">Testar INSERT perfil_aluno</button>
  <button onclick="testInsertLink()">Testar INSERT links_materias</button>
  <div id="output"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://hcngacohwiwphcbroint.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjbmdhY29od2l3cGhjYnJvaW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MDc1MjUsImV4cCI6MjA5MDQ4MzUyNX0.Rv9OlD7pltClHO2JyoEk5q7htUfUWc__StgxOQK4uaM';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, storageKey: 'studyplan-auth', autoRefreshToken: true, detectSessionInUrl: true }
    });

    const out = document.getElementById('output');

    function log(msg, type) {
      const div = document.createElement('div');
      div.className = 'log ' + (type || 'ok');
      div.textContent = (type === 'error' ? '❌ ' : type === 'warn' ? '⚠️ ' : '✅ ') + msg;
      out.appendChild(div);
    }

    function logPre(obj) {
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(obj, null, 2);
      out.appendChild(pre);
    }

    window.runDiagnostic = async function() {
      out.innerHTML = '<h3>Iniciando diagnóstico...</h3>';

      // 1. Test connection
      log('Testando conexão com Supabase...');
      try {
        const { data, error } = await supabase.from('usuarios_autorizados').select('email').limit(1);
        if (error) { log('Erro na conexão: ' + error.message, 'error'); logPre(error); }
        else log('Conexão OK — tabela usuarios_autorizados acessível');
      } catch (e) { log('Exceção na conexão: ' + e.message, 'error'); }

      // 2. Check session
      log('Verificando sessão...');
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        log('Sessão ativa! user_id: ' + session.user.id);
        log('Email: ' + session.user.email);
        log('Token expira: ' + new Date(session.expires_at * 1000).toLocaleString('pt-BR'));
        log('Email confirmado: ' + (session.user.email_confirmed_at ? 'SIM' : 'NÃO'), session.user.email_confirmed_at ? 'ok' : 'warn');
      } else {
        log('NENHUMA SESSÃO ATIVA — este é o problema!', 'error');

        // Try getUser
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
          log('getUser() encontrou usuário: ' + user.id, 'warn');
          log('Mas getSession() retornou null — token pode estar expirado', 'warn');
        } else {
          log('Nenhum usuário encontrado. Faça login primeiro.', 'error');
        }

        // Check localStorage
        const keys = Object.keys(localStorage).filter(k => k.includes('auth') || k.includes('supabase') || k.includes('sb-'));
        log('Chaves de auth no localStorage: ' + (keys.length > 0 ? keys.join(', ') : 'NENHUMA'), keys.length > 0 ? 'ok' : 'warn');

        return;
      }

      // 3. Check RLS — try SELECT on perfil_aluno
      log('Testando SELECT em perfil_aluno...');
      const { data: perfil, error: perfilErr } = await supabase
        .from('perfil_aluno')
        .select('*')
        .eq('user_id', session.user.id);

      if (perfilErr) { log('Erro SELECT perfil: ' + perfilErr.message, 'error'); logPre(perfilErr); }
      else { log('SELECT OK — ' + (perfil.length) + ' registros encontrados'); if (perfil.length > 0) logPre(perfil[0]); }

      // 4. Check RLS — try SELECT on links_materias
      log('Testando SELECT em links_materias...');
      const { data: links, error: linksErr } = await supabase
        .from('links_materias')
        .select('*')
        .eq('user_id', session.user.id);

      if (linksErr) { log('Erro SELECT links: ' + linksErr.message, 'error'); logPre(linksErr); }
      else log('SELECT OK — ' + (links.length) + ' links encontrados');

      // 5. Check localStorage
      log('--- localStorage ---');
      ['studyplan-auth', 'studyplan_perfil', 'studyplan_plan', 'studyplan_links'].forEach(key => {
        const val = localStorage.getItem(key);
        log(key + ': ' + (val ? val.substring(0, 80) + '...' : 'VAZIO'), val ? 'ok' : 'warn');
      });

      log('--- Diagnóstico concluído ---');
    };

    window.testInsertPerfil = async function() {
      out.innerHTML = '<h3>Testando INSERT em perfil_aluno...</h3>';

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { log('Sem sessão ativa!', 'error'); return; }

      const testData = {
        user_id: session.user.id,
        nome: 'Teste Debug',
        email: session.user.email,
        concurso: 'Debug Test'
      };

      log('Dados que serão enviados:');
      logPre(testData);

      const { data, error } = await supabase
        .from('perfil_aluno')
        .upsert(testData, { onConflict: 'user_id' })
        .select();

      if (error) {
        log('ERRO no INSERT/UPSERT:', 'error');
        logPre({ code: error.code, message: error.message, details: error.details, hint: error.hint });
      } else {
        log('INSERT OK!');
        logPre(data);
      }
    };

    window.testInsertLink = async function() {
      out.innerHTML = '<h3>Testando INSERT em links_materias...</h3>';

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { log('Sem sessão ativa!', 'error'); return; }

      const testData = {
        user_id: session.user.id,
        materia: 'Debug Matéria',
        titulo: 'Teste',
        url: 'https://example.com/teste',
        tipo: 'curso'
      };

      log('Dados que serão enviados:');
      logPre(testData);

      const { data, error } = await supabase
        .from('links_materias')
        .insert([testData])
        .select();

      if (error) {
        log('ERRO no INSERT:', 'error');
        logPre({ code: error.code, message: error.message, details: error.details, hint: error.hint });
      } else {
        log('INSERT OK!');
        logPre(data);
      }
    };
  </script>
</body>
</html>
